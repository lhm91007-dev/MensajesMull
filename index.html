<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enviar Mensaje</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background-color: #050505; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { width: 100%; max-width: 400px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 20px; }
        .divider { width: 100%; height: 2px; background-color: #ff0033; margin: 15px 0; }
        .title { color: #0066ff; font-size: 2rem; font-weight: bold; }
        .btn-primary { background-color: #0052cc; color: white; border: none; padding: 14px 24px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; }
        .btn-primary:disabled { background-color: #333; }
        .status-message { font-size: 0.95rem; min-height: 24px; }
        #pantalla-app { display: none; width: 100%; }
        .chat-card { background-color: #121212; border: 1px solid #222; border-radius: 12px; padding: 20px; width: 100%; text-align: left; }
        .input-control { width: 100%; padding: 12px; background-color: #1a1a1a; border: 1px solid #333; border-radius: 6px; color: white; margin-bottom: 10px; }
    </style>
</head>
<body>

    <!-- PANTALLA 1: CONEXIÓN -->
    <div id="pantalla-conexion" class="container">
        <h1 class="title">Enviar Mensaje</h1>
        <button id="btnConectar" class="btn-primary">Conectar con Backend</button>
        <div id="mensajeEstado" class="status-message"></div>
    </div>

    <!-- PANTALLA 2: APLICACIÓN -->
    <div id="pantalla-app" class="container">
        <div class="chat-card">
            <h2>Nuevo Mensaje</h2>
            <input type="text" id="destino" class="input-control" placeholder="Teléfono">
            <textarea id="mensaje" class="input-control" placeholder="Mensaje..."></textarea>
            <button id="btnEnviar" class="btn-primary">Enviar Ahora</button>
        </div>
    </div>

    <script>
        // --- URL CONFIGURADA ---
        const BACKEND_URL = 'https://lhm91007-dev.onrender.com'; 

        const btnConectar = document.getElementById('btnConectar');
        const mensajeEstado = document.getElementById('mensajeEstado');
        const pantallaConexion = document.getElementById('pantalla-conexion');
        const pantallaApp = document.getElementById('pantalla-app');

        btnConectar.addEventListener('click', async () => {
            btnConectar.disabled = true;
            mensajeEstado.textContent = 'Conectando...';

            try {
                // Probamos conectar
                const response = await fetch(`${BACKEND_URL}/health`).catch(() => null) 
                                 || await fetch(BACKEND_URL);

                if (response && response.ok) {
                    mensajeEstado.textContent = '¡Conexión exitosa!';
                    setTimeout(() => {
                        pantallaConexion.style.display = 'none';
                        pantallaApp.style.display = 'flex';
                    }, 800);
                } else {
                    throw new Error('Servidor inalcanzable');
                }
            } catch (error) {
                mensajeEstado.textContent = 'Error: No se pudo conectar al backend.';
                btnConectar.disabled = false;
            }
        });
    </script>
</body>
</html>
