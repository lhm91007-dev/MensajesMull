<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enviar Mensaje</title>
  <style>
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .container {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    hr {
      border: 0;
      height: 2px;
      background-color: #ff0033;
      margin: 20px 0;
      width: 100%;
    }

    h1 {
      color: #0066ff;
      font-size: 28px;
      margin-bottom: 20px;
    }

    .icon-box {
      background-color: #0055ff;
      width: 60px;
      height: 60px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 25px auto;
    }

    .icon-box svg {
      width: 32px;
      height: 32px;
      fill: #ff0033;
    }

    .btn-connect {
      background-color: #0055ff;
      color: #ffffff;
      border: none;
      padding: 14px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      width: 100%;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0, 85, 255, 0.4);
      transition: background-color 0.2s;
    }

    .btn-connect:active {
      background-color: #0044cc;
    }

    #mensaje-estado {
      margin-top: 20px;
      font-size: 14px;
      line-height: 1.4;
      min-height: 40px;
    }

    .error {
      color: #ff0033;
    }

    .exito {
      color: #00ff66;
    }

    .cargando {
      color: #ffcc00;
    }
  </style>
</head>
<body>

  <div class="container">
    <hr>
    
    <h1>Enviar Mensaje</h1>
    
    <div class="icon-box">
      <!-- Icono de mensaje estilo interfaz -->
      <svg viewBox="0 0 24 24">
        <path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/>
      </svg>
    </div>

    <button id="btn-backend" class="btn-connect" onclick="conectarBackend()">
      Conectar con Backend
    </button>

    <div id="mensaje-estado"></div>

    <hr>
  </div>

  <script>
    // URL de tu servidor backend en Render
    const BACKEND_URL = "https://my-backend-2-9pg8.onrender.com/";

    async function conectarBackend() {
      const boton = document.getElementById("btn-backend");
      const estado = document.getElementById("mensaje-estado");

      // Estado inicial: intentando conectar
      boton.disabled = true;
      boton.innerText = "Conectando...";
      estado.className = "cargando";
      estado.innerText = "Conectando con el servidor, por favor espera...";

      try {
        const respuesta = await fetch(BACKEND_URL, {
          method: "GET",
          headers: {
            "Content-Type": "application/json"
          }
        });

        if (!respuesta.ok) {
          throw new Error(`El servidor respondió con código: ${respuesta.status}`);
        }

        // Si conecta con éxito
        estado.className = "exito";
        estado.innerText = "¡Conexión exitosa con el servidor backend!";

      } catch (error) {
        console.error("Error de conexión:", error);
        
        estado.className = "error";
        estado.innerText = "No se pudo conectar con el servidor. Si el servidor de Render estaba inactivo, presiona el botón nuevamente en 30 segundos.";
      } finally {
        // Restaurar botón
        boton.disabled = false;
        boton.innerText = "Conectar con Backend";
      }
    }
  </script>

</body>
</html>
